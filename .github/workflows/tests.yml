# Copy to .github/workflows/tests.yml
# Lint (ruff), file consistency and acceptance tests T1–T20 on HA 2026.10.1.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -r requirements_test.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Consistency (manifest, services, strings, 5 translations)
        run: python tools/check_consistency.py
      - name: Pytest
        run: pytest -q
